# Builds FC on GitHub's own machines when a version tag (v1.2.3) is pushed: FC.exe on Windows
# and an AppImage on Linux. Each file is published to Releases with a SHA-256 checksum and a
# signed build-provenance attestation, so anyone can check the download came from this
# repository's code.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}            # nothing by default; each job asks only for what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write        # create the release and upload files
      id-token: write        # sign the provenance attestation (Sigstore, keyless)
      attestations: write    # store the attestation on GitHub
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Tag must match the version in the code
        shell: pwsh
        run: |
          $line = Select-String -Path fc.py -Pattern '^VERSION = "(.+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match VERSION $version in fc.py" }
          if (-not (Select-String -Path version_info.txt -SimpleMatch "'FileVersion', '$version'")) {
            throw "version_info.txt does not say $version"
          }

      - name: Install exact, hash-checked dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-build.txt

      - name: Build the exe
        run: python -m PyInstaller --clean --noconfirm fc.spec

      - name: Name the file and write its checksum
        shell: pwsh
        run: |
          $name = "FC-$($env:TAG.TrimStart('v'))-win64.exe"
          Move-Item "dist/FC.exe" "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "dist/$name.sha256" -Encoding ascii -NoNewline
          "EXE=dist/$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "SHA-256: $hash"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.EXE }}

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the Linux job may create the release first: then this one only adds its files
          gh release view "$env:TAG" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG" --repo "${{ github.repository }}" --title "FC $env:TAG" --generate-notes --verify-tag
          }
          gh release upload "$env:TAG" "$env:EXE" "$env:EXE.sha256" --repo "${{ github.repository }}" --clobber

  linux:
    runs-on: ubuntu-22.04      # the oldest glibc GitHub offers: the AppImage then runs on most distributions
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Tag must match the version in the code
        run: |
          version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' fc.py | head -n1)"
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match VERSION $version in fc.py"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install exact, hash-checked dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-build.txt

      - name: Build the app folder
        run: python -m PyInstaller --clean --noconfirm fc.spec

      - name: The built app must start and load its libraries
        run: ./dist/FC/FC --selftest

      - name: Wrap it in an AppImage and write its checksum
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq desktop-file-utils   # appimagetool validates FC.desktop
          bash packaging/linux/build-appimage.sh "$VERSION"
          echo "APPIMAGE=dist/FC-${VERSION}-x86_64.AppImage" >> "$GITHUB_ENV"
          cat "dist/FC-${VERSION}-x86_64.AppImage.sha256"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.APPIMAGE }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the Windows job may create the release first: then this one only adds its files
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "${{ github.repository }}" --title "FC $TAG" --generate-notes --verify-tag \
            || true
          gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sha256" --repo "${{ github.repository }}" --clobber
