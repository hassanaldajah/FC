# Builds HK File.exe on GitHub's own Windows machine when a version tag (v1.2.3) is pushed,
# then publishes it to Releases with a SHA-256 checksum and a signed build-provenance
# attestation, so anyone can check the download came from this repository's code.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}            # nothing by default; the job asks only for what it needs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write        # create the release and upload files
      id-token: write        # sign the provenance attestation (Sigstore, keyless)
      attestations: write    # store the attestation on GitHub
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      - name: Tag must match the version in the code
        shell: pwsh
        run: |
          $line = Select-String -Path hkfile.py -Pattern '^VERSION = "(.+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match VERSION $version in hkfile.py" }
          if (-not (Select-String -Path version_info.txt -SimpleMatch "'FileVersion', '$version'")) {
            throw "version_info.txt does not say $version"
          }

      - name: Install exact, hash-checked dependencies
        run: python -m pip install --require-hashes --no-deps -r requirements.txt -r requirements-build.txt

      - name: Build the exe
        run: python -m PyInstaller --clean --noconfirm hkfile.spec

      - name: Name the file and write its checksum
        shell: pwsh
        run: |
          $name = "HKFile-$($env:TAG.TrimStart('v'))-win64.exe"
          Move-Item "dist/HK File.exe" "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File "dist/$name.sha256" -Encoding ascii -NoNewline
          "EXE=dist/$name" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "SHA-256: $hash"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.EXE }}

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:TAG" "$env:EXE" "$env:EXE.sha256" `
            --repo "${{ github.repository }}" --title "HK File $env:TAG" --generate-notes --verify-tag
